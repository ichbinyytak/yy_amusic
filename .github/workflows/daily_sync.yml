name: Daily Sync Sound Sources

on:
  schedule:
    # 每天 UTC 20:45 (北京时间每天凌晨 04:45 自动运行)
    - cron: '45 20 * * *'
  # 支持在 GitHub Actions 网页上一键手动立即执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sources:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行纯 Python 原生音源测速排班
        run: python3 sync_sources.py

      - name: 提交并推送最新测速排班表
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sources_ranking.json
          git diff --staged --quiet || (git commit -m "chore(auto): 自动测速原生音源并更新排班表 [skip ci]" && git push)
