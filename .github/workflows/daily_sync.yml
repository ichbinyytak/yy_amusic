name: Daily Sync Sound Sources

on:
  schedule:
    # 每天 UTC 21:00 (北京时间每天凌晨 05:00 自动运行，与 yy-lx-hub 04:00 相差 1 小时)
    - cron: '0 21 * * *'
  # 支持在 GitHub Actions 网页上一键手动立即执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-sources:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取 yy-lx-hub 密文并运行纯 Python 原生音源测速排班
        env:
          AMUSIC_SYNC_KEY: ${{ secrets.AMUSIC_SYNC_KEY }}
          AMUSIC_SYNC_SECRET: ${{ secrets.AMUSIC_SYNC_SECRET }}
        run: python3 sync_sources.py --pull

      - name: 提交并推送最新密文与测速排班表
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          [ -f extracted_apis.enc ] && git add extracted_apis.enc
          git add sources_ranking.json
          git diff --staged --quiet || (git commit -m "chore(auto): 同步 yy-lx-hub 密文并更新排班表 [skip ci]" && git push)
